services:
  app:
    # Set GROWUP_IMAGE to run a published image, e.g. ghcr.io/<owner>/<repo>:latest
    image: ${GROWUP_IMAGE:-growup:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:24-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DEMO_MODE: "0"
      DATA_PATH: /app/data/growup.sqlite
      # Optional: require this code in the first-run web setup wizard.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8787"
    volumes:
      - growup-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  growup-data:
