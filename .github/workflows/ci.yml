name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lockfile pins a mirror; on GitHub runners install from the npm registry.
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --registry="$NPM_REGISTRY" --replace-registry-host=always

      - name: Check formatting
        run: npx prettier --check web server/*.mjs tests/*.mjs tests/helpers tests/server vite.config.js

      - name: Build web
        run: npm run build

      - name: Server tests
        run: npm test

      - name: Mini program checks
        run: |
          node miniprogram/validate.mjs
          node miniprogram/api-smoke.mjs
          npm run test:mini:enrollment

      # ubuntu-latest ships Google Chrome, which the Playwright tests use.
      - name: Browser tests
        run: |
          npm run test:ui
          npm run test:ui:enrollment
          npm run test:ui:migration

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: docs/verification
          retention-days: 14

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --registry="$NPM_REGISTRY" --replace-registry-host=always

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha

      # Build once for the runner's platform and test it before publishing.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: growup:local
          build-args: |
            NODE_IMAGE=node:24-alpine
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container tests
        run: |
          npm run test:docker
          npm run test:docker:fresh

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=node:24-alpine
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
